[general]
import = ["themes/nightfox.toml", "keybindings.toml"]

[window]
dimensions = { columns = 150, lines = 35 }
padding = { x = 8, y = 8 }
dynamic_title = false

[font]
normal = { family = "JetBrainsMonoNL NF", style = "Regular" }
size = 11

[colors]
draw_bold_text_with_bright_colors = true

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 500
blink_timeout = 0
unfocused_hollow = false
thickness = 0.1

[terminal]
shell = { program = "bash", args = [] }

[mouse]
hide_when_typing = true
